; Styx: Shards of Darkness - Styx 2 Upscaler (ReShade add-on) settings
; Everything here can also be changed in game: Home > Add-ons > Styx 2 Upscaler.

[Upscaler]
; 1 = FSR 4 / XeSS / DLSS replaces the game's TAA, 0 = the game's own TAA
Enabled=1
; Render resolution, applies after a restart of the game:
; 0 = Native AA (100%), 1 = Quality (67%), 2 = Balanced (59%), 3 = Performance (50%)
Quality=0
; Upscaler run by OptiScaler, applies after a restart:
; fsr31_12 = FSR 4 on RX 9000, FSR 3.1 on other GPUs | xess_12 = XeSS | dlss = DLSS (NVIDIA RTX, needs
; nvngx_dlss.dll next to the game exe) | fsr22 = FSR 2.2 (native DX11)
Backend=fsr31_12

[Latency]
; 1 = AMD Anti-Lag 2 on Radeon GPUs (driver 24.6.1 or newer), 0 = off
AntiLag2=1
; Used when Anti-Lag 2 is off or unavailable (NVIDIA, Intel): how many frames the CPU may prepare ahead
; of the GPU (Windows default 3). 1 = lowest input latency, 0 = leave the game's setting.
MaxFrameLatency=1

[Debug]
; 0 = off, 1 = motion vectors, 2 = pass-through (no upscaler), 3 = velocity check
View=0
; Logs every TAA-like draw call of N frames (20 s and 60 s after start) to ReShade.log
LogCandidates=0
